[project]
name = "auto-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "rkorona",email = "korona.starx@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer (>=0.27.2,<0.28.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncio"
]

[project.scripts]
auto-bot = "auto_bot.cli.app:main"

[tool.poetry]
packages = [{include = "auto_bot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
