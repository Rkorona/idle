<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Link Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand-mark">↘</div>
      <div>
        <strong>Orbit</strong>
        <span>Link Bridge</span>
      </div>
      <span class="version">0.1</span>
    </header>

    <section class="current-card">
      <div class="eyebrow">CURRENT TAB</div>
      <div id="tab-title" class="tab-title">Reading current page…</div>
      <div id="tab-url" class="tab-url"></div>
      <button id="send-current" class="primary" disabled>Send current tab ↗</button>
    </section>

    <section class="manual-card">
      <label class="eyebrow" for="custom-url">DIRECT FILE LINK</label>
      <input id="custom-url" type="url" placeholder="https://example.com/file.zip" inputmode="url">
      <button id="send-custom" class="secondary">Send link to Orbit</button>
    </section>

    <label class="toggle">
      <input type="checkbox" id="auto-intercept" checked>
      <span>Send browser downloads to Orbit automatically</span>
    </label>

    <p id="status" role="status" aria-live="polite">Direct HTTP(S) links are supported.</p>
    <footer>Orbit Download for Android</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
