[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-mmo-api"
version = "0.1.0"
description = "Typed, authorization-aware interface definitions extracted from local HTTP captures"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
