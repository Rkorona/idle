# accounts.example.yml  —— 复制为 accounts.yml 后填写真实信息
# accounts.yml 已加入 .gitignore，请勿提交到仓库或分享给他人。

default_account: "main"

accounts:
  main:
    email: "kulael3@gmail.com"
    # 推荐：不要把真实密码写入 YAML；使用 password_env 引用环境变量。
    password_env: "IDLEMMO_MAIN_PASSWORD"
    remark: "大号（收货方）"
    role: main          # main = 不参与自动挂机调度

  worker_1:
    email: "rkoronax@proton.me"   # ⚠ 每个小号必须使用不同邮箱，否则并发会互相顶号
    password_env: "IDLEMMO_WORKER_1_PASSWORD"
    remark: "小号1"
    role: worker        # worker = 参与调度（省略时默认即为 worker）

  