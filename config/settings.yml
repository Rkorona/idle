# settings.example.yml —— 复制为 settings.yml 后按需修改（不创建则全部用默认值）

max_concurrent_workers: 10   # 同 IP 并发小号上限，不允许超过 10
stagger_seconds: 5           # 各小号启动错峰间隔(秒)

storage_backend: sqlite      # sqlite=多进程安全持久化；json=兼容旧版单进程模式
sqlite_db: data/state.db

# P13：数据库迁移、完整性检查与备份恢复
database:
  event_retention_days: 30
  maintenance_interval_seconds: 3600
  backup_dir: data/backups
  backup_retention: 5
  safety_backup_before_restore: true


# P14：统一可观测性；json 适合后续日志采集，text 适合 Termux 人工查看
observability:
  log_format: text
  health_history_retention_days: 30
  diagnostic_event_limit: 100

# 所有账号共享的请求节奏；429/5xx 会继续执行安全重试并尊重 Retry-After
requests_per_minute: 45
rate_burst: 3
rate_jitter_seconds: 0.15

# 从游戏技能目录动态解析 skill_item_id / inventory_item_id / wait_length
dynamic_catalog:
  enabled: true
  cache_ttl_seconds: 900

# 无任务时按预估金币/分钟自动选择赚钱材料
gold_mode:
  enabled: false
  strategy: profit_per_minute
  batch_size: 100
  tier: 1
  min_profit_per_minute: 0
  skills:
    - woodcutting
    - mining
  candidates: []

# Worker 异常退出时由 Supervisor 自动重启
max_worker_restarts: 3
worker_restart_backoff: 5
worker_restart_window_seconds: 900   # 900 秒窗口内最多自动重启 max_worker_restarts 次
worker_stable_reset_seconds: 300     # 连续稳定运行 5 分钟后恢复重启额度
health_max_age_seconds: 120           # Worker 多久没心跳算 stale
trade_receiver_rescan_seconds: 30      # 交易接收器定期从持久化状态重扫，修复内存队列异常丢失

# P12：按账号隔离的 Session 生命周期与登录保护；不持久化 Cookie/Token/密码
session_pool:
  session_ttl_seconds: 1800            # 达到 TTL 主动续期，实际 Session 失效仍由 API 触发即时重登
  max_login_failures: 5                # 时间窗口内连续登录失败达到阈值后隔离账号
  login_failure_window_seconds: 900    # 登录失败统计窗口 / 默认隔离时长
  login_backoff_base: 5
  login_backoff_max: 120
  stable_reset_seconds: 300             # 稳定运行后清理旧登录失败记录
  max_concurrent_logins: 1              # 全局并发登录上限，避免集中登录风暴

# Scheduler 2.0：优先级 aging、防饿死；任务自身可配置 cooldown/deadline/resources。
scheduler:
  aging_seconds_per_priority: 300       # 每等待 5 分钟增加 1 点有效优先级
  max_aging_boost: 10                   # aging 最多额外增加 10 点
  starvation_threshold_seconds: 1800    # 可调度任务超过 30 分钟未轮到则标记 starvation_risk

# 连续 HTTP 429/5xx/网络故障达到阈值后，暂停新的请求并等待探测
circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_seconds: 30

# 备用赚钱方案：当前启用的是上面的 gold_mode，这里暂不启用。
# value 是单件材料出售给 NPC 获得的金币，仅在明确知道 NPC 单价时填写。
# 第一项是优先材料，只有当前一项本轮失败才会尝试下一项备用材料。
sell_plan:
  - name: "Yew Log"
    skill: "woodcutting"
    auto_discover: true
    batch_size: 100
    value: 2
  - name: "Limestone"
    skill: "mining"
    auto_discover: true
    batch_size: 100
    value: 4
  
  - name: "Coal Ore"
    skill: "mining"
    auto_discover: true
    batch_size: 100
    value: 1

# gold_mode.candidates 也支持相同的 {name, skill} 动态解析。

# P15：安全加固
security:
  require_secure_permissions: true
  scan_project_on_start: false
  secret_scan_max_bytes: 2000000
