# settings.example.yml —— 复制为 settings.yml 后按需修改（不创建则全部用默认值）

max_concurrent_workers: 10   # 同 IP 并发小号上限，不允许超过 10
stagger_seconds: 5           # 各小号启动错峰间隔(秒)

# 没有任务可领时，小号按顺序轮流采集这些材料并出售，攒金币付交易手续费。
# 注意：出售接口 (api.py 的 sell_item) 需要你抓包后补全；
#       在补全之前保持本节为空即可，小号会在无任务时空闲等待。
sell_plan: []
